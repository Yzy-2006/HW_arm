# Camera facing the operator; robot axes X forward, Y left, Z up.
camera_to_robot_rotation:
  - [0, 0, -1]
  - [1, 0, 0]
  - [0, -1, 0]
swap_hands: false
# Multipliers applied to hand translation and rotation increments.
position_scale: 1.0
orientation_scale: 1.0
# Input speed caps; null disables the corresponding cap.
position_speed_mps: null
orientation_speed_radps: null
joint_speed_radps: 0.8  # Mapper schema only; hardware joint limits remain downstream.
max_position_jump_m: 0.04
max_orientation_jump_rad: 0.3
max_frame_gap_s: 0.15
timeout_s: 0.25
resume_grace_s: 1.0
recovery_hold_s: 0.2
min_quality: 0.0
release_hold_s: 0.2
event_hold_s: 0.2
feedback_timeout_s: 0.2
home_timeout_s: 20.0
home_position_tolerance_rad: 0.04
home_speed_tolerance_radps: 0.08
