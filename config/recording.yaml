task: "fold a towel with both arms"
dataset_root: data/raw/fold_towel
fps: 30
width: 640
height: 480
min_episode_frames: 30
# Receive-time checks, not hardware synchronization. Timestamps are preserved.
max_stream_age_s: 0.20
max_stream_skew_s: 0.10
max_camera_age_s: 0.15
max_camera_skew_s: 0.07
max_frame_gap_s: 0.10
# Pending captured frames (three images each), plus one frame being written.
writer_queue_frames: 16
writer_finish_timeout_s: 10.0
# Starts after directory/metadata preparation; recording time starts at first capture.
startup_timeout_s: 3.0
# Drop samples whose largest absolute joint-position change from the last
# saved sample is below this threshold. Units: radians; gripper changes are
# always retained even when the arms are stationary.
min_joint_delta_rad: 0.01
# Optional: publish all three captured RGB streams to RViz. This does not publish
# robot commands and does not change the frames written to disk.
publish_rviz: false
cameras:
  head: "261222075640"
  left_wrist: "260422274993"
  right_wrist: "260422274509"
