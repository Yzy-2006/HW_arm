# Camera optical -> operator-facing robot axes: (x, y, z) -> (-z, x, -y).
# Proper rotation, not an image reflection. Adjust for camera mounting if needed.
camera_to_robot_rotation:
  - [0, 0, -1]
  - [1, 0, 0]
  - [0, -1, 0]
swap_hands: false
position_scale: 1.0
orientation_scale: 1.0
position_speed_mps: 0.25
orientation_speed_radps: 1.0
joint_speed_radps: 0.8
max_position_jump_m: 0.08
max_orientation_jump_rad: 0.6
max_frame_gap_s: 0.20
timeout_s: 0.35
# Stop on invalid input immediately; retain clutch intent through brief glitches.
resume_grace_s: 1.0
recovery_hold_s: 0.15
min_quality: 0.0
release_hold_s: 0.15
event_hold_s: 0.10
recording_root: data/gesture_rviz
