# PI05 deployment defaults. Keep this file separate from recording.yaml: the
# bridge opens the cameras itself and must not start the passive recorder too.
model_path: "$HOME/models/pi05-encos-fold-towel-93"
task: "fold a towel with both arms"

# Paths may be absolute or relative to the repository root.
camera_config: config/recording.yaml
gripper_config: teleop/VR_controller/config/grippers.yaml
controller_config: ros2_ws/src/ctl_msgs_hw/config/controllerConfig.yaml
pd_config: ros2_ws/src/ctl_msgs_hw/config/initialPD.yaml
urdf: ros2_ws/src/dual_arm_hw/urdf/dual_arm.urdf

worker:
  # New flat-towel B model uses inference_flat_towel.py instead.
  inference_entry: inference.py
  host: 127.0.0.1
  port: 8765
  token: ""
  timeout_s: 5.0
  # Flow-matching integration steps per inference, not output action count.
  num_steps: 20
  # Expected native action chunk length. The published inference.py fixes this
  # at 50; changing this value alone cannot change the model architecture.
  action_horizon: 50

bridge:
  rate_hz: 30
  # Time spacing of predicted actions is 1 / action_rate_hz seconds.
  # Keep 30 to match the dataset; independent of the bridge control timer.
  action_rate_hz: 30
  interpolation:
    enabled: true
    publish_rate_hz: 50
  # Replay only: immediate stop/damping for any arm joint, including speed_only mode.
  replay_max_tracking_error_rad: 0.3
  # Standalone feedback-to-first-frame segment for dataset replay only.
  # Also capped by motion_safety and the servo homingHandoff settings.
  # Arrival tolerances/settling below are bypassed in speed_only protection mode.
  replay_approach:
    max_velocity_rad_s: 5.0
    max_acceleration_rad_s2: 1.0
    min_duration_s: 1.0
    position_tolerance_rad: 0.1
    velocity_tolerance_rad_s: 0.05
    settle_time_s: 0.2
    settle_timeout_s: 10.0
  motion_safety:
    policy_disable_all_speed_checks: true  # Model stream only, including servo command/feedback checks.
    policy_command_speed_check: false  # Model bridge only; replay and servo limits remain configured separately.
    protection_mode: speed_only  # Disable non-speed software trips; explicit faults/stops remain latched.
    speed_limit_enabled_per_arm: [true, true, true, true, false, false, false]
    check_position_limits: false  # Disable absolute joint position checks and URDF clipping.
    max_velocity_rad_s: 5.0
    max_acceleration_rad_s2: null  # Disable acceleration trips; velocity checks remain active.
    max_tracking_error_rad: 0.3
    tracking_timeout_s: 0.1
  state_timeout_s: 0.25  # Used in full mode; speed_only accepts cached finite feedback.
  # Refresh the horizon asynchronously; control and feedback never wait for it.
  replan_interval_s: 0.5
  # Full mode only: reject actions older than this observation age.
  max_action_age_s: 1.0
  jpeg_quality: 80
  # Policy deployment defaults.
  pd_level: mid
  rigidity_mode: 2
  # Replay uses this preset; capped Kd uses custom-PD mode to preserve the cap.
  replay_pd_level: mid
  # Full mode only: maximum target offset from fresh joint feedback at each bridge tick.
  # This is deliberately small
  # for first tests; increase only after replay and dry-run checks pass.
  max_joint_step_rad: 0.3
  # Scales feedback-relative allowance only, not physical speed or acceleration.
  slow_factor: 1.0
