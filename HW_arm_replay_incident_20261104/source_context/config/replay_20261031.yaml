# Replay-side reference for the successful 2026-10-31 11:55 test.
# Use with --speed 0.5; 30 FPS data then produces 15 Hz commands.
# This profile does not change the running ROS controller loop rates.
gripper_config: teleop/VR_controller/config/grippers.yaml
controller_config: ros2_ws/src/ctl_msgs_hw/config/controllerConfig.yaml
pd_config: ros2_ws/src/ctl_msgs_hw/config/initialPD.yaml
urdf: ros2_ws/src/dual_arm_hw/urdf/dual_arm.urdf

bridge:
  state_timeout_s: 0.25
  pd_level: mid
  rigidity_mode: 2
  max_joint_step_rad: 0.3
  # Feedback-relative target allowance: 0.3 * 0.3 = 0.09 rad.
  # This is not a speed setting or a limit on successive command changes.
  slow_factor: 0.3
  interpolation:
    enabled: false
