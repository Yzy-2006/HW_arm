# ============================================================
# 机械臂笛卡尔空间零位配置
# ============================================================
# 协议说明：
#   1. 位姿格式：[x, y, z, roll, pitch, yaw]
#      - x, y, z      — 末端位置，单位：米 (m)
#      - roll, pitch, yaw — 末端姿态（RPY 欧拉角），单位：弧度 (rad)
#   2. 零位定义：zeropos.yaml 关节回零位置的正运动学末端位姿
#      基坐标系 arm_base_link；末端 arm_l_link_8 / arm_r_link_8。
#      make save-arm-zero SIDE=both TARGET=both 可同步两种零位。
#   3. 顺序与 msgPublish.h 中 lArm_desPos_descartes / rArm_desPos_descartes 一致
# ============================================================

